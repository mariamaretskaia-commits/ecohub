name: keepalive

on:
  schedule:
    # Hourly wake of the free-tier Render web service (Render free plans
    # sleep after ~15 min of no traffic). Kept at a minimum to avoid
    # notification noise; runs never fail so GitHub stays quiet.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ecohub health endpoint
        id: ping
        continue-on-error: true
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 https://ecohub-baoc.onrender.com/health)
          echo "health HTTP $code"
          if [ "$code" != "200" ]; then
            # Service may be waking from sleep; retry once and report, but never fail the run.
            sleep 20
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 https://ecohub-baoc.onrender.com/health)
            echo "health retry HTTP $code"
          fi
          echo "status=$code" >> "$GITHUB_OUTPUT"
      - name: Alert developer on outage (Telegram only)
        if: steps.ping.outputs.status != '200'
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.DEVELOPER_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="EcoHub nedostupen: keepalive ping HTTP ${{ steps.ping.outputs.status }} at $(date -u). Check https://ecohub-baoc.onrender.com/health" > /dev/null