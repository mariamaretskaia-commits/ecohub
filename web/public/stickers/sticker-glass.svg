<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gbody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="gneck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- крЫшка -->
  <g>
    <rect x="188" y="64" width="136" height="56" rx="24" fill="#ffffff"/>
    <rect x="188" y="64" width="136" height="56" rx="24" fill="#0369a1" stroke="#075985" stroke-width="10"/>
    <rect x="214" y="82" width="84" height="14" rx="7" fill="#7dd3fc" opacity="0.85"/>
  </g>

  <!-- горлышко (белый контур-гало) -->
  <path d="M194 148 h124 v86 a10 10 0 0 1 -10 10 h-104 a10 10 0 0 1 -10 -10 z"
        fill="#ffffff"/>
  <!-- горлышко -->
  <path d="M194 148 h124 v86 a10 10 0 0 1 -10 10 h-104 a10 10 0 0 1 -10 -10 z"
        fill="url(#gneck)" stroke="#0284c7" stroke-width="10"/>
  <rect x="214" y="160" width="84" height="12" rx="6" fill="#bae6fd" opacity="0.9"/>

  <!-- корпус бутыли (белый контур-гало) -->
  <path d="M196 236 v100 q0 84 60 84 q60 0 60 -84 v-100 q0 -14 -14 -14 h-92 q-14 0 -14 14 z"
        fill="#ffffff"/>
  <!-- корпус -->
  <path d="M196 236 v100 q0 84 60 84 q60 0 60 -84 v-100 q0 -14 -14 -14 h-92 q-14 0 -14 14 z"
        fill="url(#gbody)" stroke="#0284c7" stroke-width="10" stroke-linejoin="round"/>

  <!-- блики стекла -->
  <path d="M224 250 v120"
        stroke="#e0f2fe" stroke-width="18" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M228 234 q20 -18 44 0"
        stroke="#e0f2fe" stroke-width="13" stroke-linecap="round" fill="none" opacity="0.8"/>
  <circle cx="286" cy="330" r="12" fill="#bae6fd" opacity="0.75"/>
  <circle cx="292" cy="356" r="7" fill="#bae6fd" opacity="0.6"/>

  <!-- этикетка-кружок "переработка" -->
  <g>
    <circle cx="256" cy="330" r="58" fill="#bae6fd" stroke="#ffffff" stroke-width="10"/>
    <circle cx="256" cy="330" r="58" fill="#0c4a6e"/>
    <g transform="rotate(-120 256 330)">
      <path d="M256 282 L302 356 L210 356 Z"
            fill="none" stroke="#e0f2fe" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>
      <!-- стрелки по часовой -->
      <path d="M256 282 l-16 -20 h14 l20 32"
            fill="none" stroke="#e0f2fe" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M302 356 l22 -10 v16 l-32 -18"
            fill="none" stroke="#e0f2fe" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M210 356 l-22 -10 v16 l32 -18"
            fill="none" stroke="#e0f2fe" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
    <circle cx="256" cy="330" r="58" fill="none" stroke="#e0f2fe" stroke-width="6" opacity="0.6" stroke-dasharray="2 14"/>
  </g>
</svg>