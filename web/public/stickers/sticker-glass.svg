<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gBody" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#c8f0ff"/>
      <stop offset="0.4" stop-color="#5fc0ec"/>
      <stop offset="1" stop-color="#1478c0"/>
    </linearGradient>
    <linearGradient id="gNeck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6f4ff"/>
      <stop offset="1" stop-color="#6fc3ef"/>
    </linearGradient>
    <linearGradient id="gCap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cf0b8"/>
      <stop offset="0.5" stop-color="#2cd783"/>
      <stop offset="1" stop-color="#0f9e5a"/>
    </linearGradient>
    <linearGradient id="gLabel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b5"/>
      <stop offset="1" stop-color="#ffd84a"/>
    </linearGradient>
    <radialGradient id="gShadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0b2a47" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0b2a47" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- мягкая тень-подушка -->
  <ellipse cx="256" cy="462" rx="166" ry="28" fill="url(#gShadow)"/>

  <!-- крышка: объёмная зелёная с рифлением -->
  <rect x="186" y="44" width="140" height="72" rx="32" fill="#0a0a0a"/>
  <rect x="194" y="52" width="124" height="58" rx="26" fill="url(#gCap)"/>
  <rect x="194" y="52" width="124" height="58" rx="26" fill="none" stroke="#063d22" stroke-width="3"/>
  <rect x="210" y="56" width="92" height="11" rx="5" fill="#ffffff" opacity="0.75"/>
  <path d="M222 70 v32 M252 70 v32 M282 70 v32 M312 70 v32"
        stroke="#0f6b43" stroke-width="8" stroke-linecap="round" opacity="0.55"/>
  <rect x="180" y="112" width="152" height="14" rx="7" fill="#0a0a0a"/>

  <!-- горлышко -->
  <rect x="196" y="118" width="120" height="92" rx="12" fill="#0a0a0a"/>
  <rect x="204" y="124" width="104" height="82" rx="8" fill="url(#gNeck)"/>
  <rect x="204" y="124" width="104" height="20" rx="10" fill="#ffffff" opacity="0.55"/>
  <rect x="230" y="164" width="52" height="9" rx="4" fill="#0d3f66" opacity="0.35"/>

  <!-- корпус бутылки: широкие плечи, широкое дно, верх заходит под горлышко -->
  <path d="M190 212 L322 212 Q336 212 340 224 L360 262 Q366 274 366 286 L366 330 Q366 424 256 430 Q146 424 146 330 L146 286 Q146 274 152 262 L172 224 Q176 212 190 212 Z"
        fill="#0a0a0a"/>
  <path d="M200 206 L312 206 Q326 206 330 218 L350 256 Q356 268 356 280 L356 330 Q356 414 256 420 Q156 414 156 330 L156 280 Q156 268 162 256 L182 218 Q186 206 200 206 Z"
        fill="url(#gBody)"/>

  <!-- объём: тёмное дно и светлая глазурь -->
  <path d="M156 340 Q240 380 356 340 Q260 400 160 350 Z"
        fill="#0d4a7d" opacity="0.28"/>
  <ellipse cx="256" cy="416" rx="86" ry="16" fill="#0b3a63" opacity="0.35"/>
  <path d="M204 214 Q256 200 316 214 Q256 232 204 214 Z" fill="#eafcff" opacity="0.85"/>

  <!-- глянцевые блики стекла -->
  <path d="M200 300 v50 q0 30 26 44 q-22 -10 -28 -28 q-6 -14 -6 -28 v-38 z" fill="#ffffff" opacity="0.9"/>
  <path d="M330 296 q14 -12 28 0 v16 q-14 -10 -28 -4 z" fill="#ffffff" opacity="0.85"/>
  <circle cx="342" cy="352" r="7" fill="#ffffff" opacity="0.85"/>
  <circle cx="172" cy="390" r="6" fill="#ffffff" opacity="0.75"/>

  <!-- этикетка: жёлтый круг со знаком переработки -->
  <g>
    <circle cx="256" cy="352" r="58" fill="#0a0a0a"/>
    <circle cx="256" cy="352" r="52" fill="url(#gLabel)"/>
    <circle cx="256" cy="352" r="52" fill="none" stroke="#0a0a0a" stroke-width="7"/>
    <circle cx="256" cy="352" r="40" fill="#147a48"/>
    <g transform="rotate(-120 256 352)">
      <path d="M256 314 L286 373 L226 373 Z"
            fill="none" stroke="#eafff2" stroke-width="13" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M256 314 l-12 -15 h11 l14 26"
            fill="none" stroke="#eafff2" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M286 373 l17 -8 v12 l-25 -15"
            fill="none" stroke="#eafff2" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M226 373 l-17 -8 v12 l25 -15"
            fill="none" stroke="#eafff2" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
    <circle cx="230" cy="330" r="6" fill="#ffffff" opacity="0.85"/>
    <circle cx="270" cy="322" r="4" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- пузырьки-искорки вокруг -->
  <circle cx="344" cy="278" r="9" fill="#ffffff" stroke="#0a0a0a" stroke-width="4"/>
  <circle cx="158" cy="288" r="7" fill="#ffffff" stroke="#0a0a0a" stroke-width="4"/>
  <circle cx="360" cy="410" r="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="4"/>
  <circle cx="148" cy="420" r="5" fill="#ffffff" stroke="#0a0a0a" stroke-width="4"/>
</svg>