<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.12" stop-color="#cfeaff" stop-opacity="0.74"/>
      <stop offset="0.42" stop-color="#93c9ef" stop-opacity="0.64"/>
      <stop offset="0.75" stop-color="#5fa8e0" stop-opacity="0.74"/>
      <stop offset="1" stop-color="#2f7dc0" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="gNeck" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#a8d5f5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2f74ad" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="gLip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f8ff"/>
      <stop offset="0.5" stop-color="#9fc9e8"/>
      <stop offset="1" stop-color="#35698f"/>
    </linearGradient>
    <linearGradient id="gShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a5f" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1e3a5f" stop-opacity="0.0"/>
    </linearGradient>
    <radialGradient id="gGlint" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pRibs" x="0" y="0" width="6" height="10" patternUnits="userSpaceOnUse">
      <path d="M4 0 v10" stroke="#1d5da8" stroke-width="1.6" stroke-opacity="0.3" fill="none"/>
    </pattern>
    <filter id="fBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="fBlur2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <!-- мягкая тень под бутылкой -->
  <ellipse cx="256" cy="460" rx="174" ry="24" fill="url(#gShadow)" filter="url(#fBlur)"/>
  <ellipse cx="256" cy="458" rx="130" ry="15" fill="#0d3b66" opacity="0.26" filter="url(#fBlur2)"/>

  <!-- ободок горлышка (грань стекла) -->
  <rect x="196" y="48" width="120" height="34" rx="11" fill="url(#gLip)"/>
  <rect x="196" y="48" width="120" height="34" rx="11" fill="none" stroke="#eef7ff" stroke-opacity="0.9" stroke-width="3"/>
  <rect x="218" y="54" width="76" height="7" rx="3.5" fill="#ffffff" opacity="0.85"/>

  <!-- горловина с кольцами -->
  <path d="M210 82 h92 v82 C302 176 302 160 302 160 C302 186 320 194 340 208
           C374 228 396 280 396 344 L396 406
           C396 446 362 458 332 458 L180 458
           C150 458 116 446 116 406 L116 344
           C116 280 138 228 172 208 C192 194 210 186 210 160
           C210 160 210 176 210 82 Z"
        fill="url(#gBody)" stroke="#2f74ad" stroke-opacity="0.55" stroke-width="5" stroke-linejoin="round"/>
  <rect x="214" y="96" width="84" height="10" rx="5" fill="url(#gNeck)"/>
  <rect x="214" y="96" width="84" height="4" rx="2" fill="#ffffff" opacity="0.55"/>
  <rect x="214" y="122" width="84" height="10" rx="5" fill="url(#gNeck)"/>
  <rect x="214" y="148" width="84" height="12" rx="6" fill="url(#gNeck)"/>

  <!-- фактура-рифление стекла -->
  <path d="M156 258 Q256 240 356 258"
        fill="none" stroke="url(#pRibs)" stroke-width="30" stroke-opacity="0.85"/>

  <!-- правая тёмная кромка (внутренняя рефракция) -->
  <path d="M390 350 L390 400 C390 434 364 446 338 450 L338 446 C366 442 384 428 384 398 L384 346 Z"
        fill="#0b4f8f" opacity="0.35"/>
  <path d="M122 352 L122 402 C122 434 148 446 174 450 L174 446 C146 442 130 428 130 398 L130 348 Z"
        fill="#ffffff" opacity="0.35"/>

  <!-- вертикальный блик слева (освещение от окна) -->
  <rect x="146" y="228" width="20" height="196" rx="10" fill="url(#gGlint)"/>
  <rect x="152" y="240" width="7" height="176" rx="3.5" fill="#ffffff" opacity="0.92"/>

  <!-- редкий свет по правому краю -->
  <rect x="374" y="258" width="11" height="120" rx="5.5" fill="#ffffff" opacity="0.5"/>
  <rect x="376" y="266" width="4" height="104" rx="2" fill="#f2f9ff" opacity="0.85"/>

  <!-- горизонтальные переливы стекла -->
  <path d="M146 392 Q256 372 370 392" stroke="#2d6ca8" stroke-opacity="0.35" stroke-width="3.5" fill="none"/>
  <path d="M140 298 Q256 282 376 298" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2.5" fill="none"/>

  <!-- маленькие точечные блики -->
  <circle cx="218" cy="322" r="8" fill="#ffffff" opacity="0.8"/>
  <circle cx="230" cy="311" r="3.5" fill="#ffffff" opacity="0.7"/>

  <!-- дно: плотная подложка -->
  <path d="M180 458 C150 458 116 446 116 406 L116 400 C116 428 142 440 180 450 L332 450 C370 440 396 428 396 400 L396 406 C396 446 362 458 332 458 Z"
        fill="#0b4f8f" opacity="0.28"/>
</svg>